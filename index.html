<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An enhanced platform adventure game. Guide your warrior through challenging levels!">
    <meta name="theme-color" content="#1a2980">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Warrior's Quest">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180x180.png">
    <title>Warrior's Quest - Enhanced Platform Adventure</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #1a2980, #26d0ce);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        .game-container {
            position: relative;
            width: 900px;
            height: 500px;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        canvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 70%, #C8E6C9 100%);
        }
        
        .game-info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        
        .controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        
        .game-over, .game-win, .level-complete {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 20;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #45a049;
        }
        
        .power-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-info">
            <div>Level: <span id="level">1</span></div>
            <div>Lives: <span id="lives">3</span></div>
            <div>Score: <span id="score">0</span></div>
        </div>
        <div class="controls">
            <div>Arrow Keys: Move | Spacebar: Jump | Z: Attack</div>
        </div>
        <div class="power-indicator" id="powerIndicator"></div>
        <canvas id="gameCanvas" width="900" height="500"></canvas>
        <div class="game-over" id="gameOver">
            <h2>Game Over!</h2>
            <p>Your warrior's journey has ended.</p>
            <button id="restartBtn">Try Again</button>
        </div>
        <div class="game-win" id="gameWin">
            <h2>Victory!</h2>
            <p>You've completed all quests!</p>
            <button id="playAgainBtn">Play Again</button>
        </div>
        <div class="level-complete" id="levelComplete">
            <h2>Level Complete!</h2>
            <p>Prepare for the next challenge!</p>
            <button id="nextLevelBtn">Next Level</button>
        </div>
    </div>

                const levelMonsters = [];
                const levelCollectibles = [];
                const levelPowerUps = [];
                
                for (let i = 0; i < worldWidthMultiplier; i++) {
                    const shiftX = i * 3000;
                    basePlatforms.forEach(platform => {
                        levelPlatforms.push({ ...platform, x: platform.x + shiftX });
                    });
                }
                
                for (let i = 0; i < obstacleMultiplier; i++) {
                    const shiftX = i * 300;
                    baseObstacles.forEach(obstacle => {
                        levelObstacles.push({ ...obstacle, x: obstacle.x + shiftX });
                    });
                }
                
                for (let i = 0; i < obstacleMultiplier; i++) {
                    const shiftX = i * 300;
                    baseMonsters.forEach(monster => {
                        levelMonsters.push({
                            ...monster,
                            x: monster.x + shiftX,
                            minX: monster.minX + shiftX,
                            maxX: monster.maxX + shiftX,
                            animFrame: 0,
                            animTimer: 0,
                            hurtTimer: 0,
                            isHurt: false,
                            bounceOffset: 0,
                            wingAngle: 0,
                            originalY: monster.y
                        });
                    });
                }
                
                for (let i = 0; i < worldWidthMultiplier; i++) {
                    const shiftX = i * 3000;
                    baseCollectibles.forEach(collectible => {
                        levelCollectibles.push({ ...collectible, x: collectible.x + shiftX, bobOffset: Math.random() * Math.PI * 2 });
                    });
                }
                
                for (let i = 0; i < worldWidthMultiplier; i++) {
                    const shiftX = i * 3000;
                    basePowerUps.forEach(powerUp => {
                        levelPowerUps.push({ ...powerUp, x: powerUp.x + shiftX, bobOffset: Math.random() * Math.PI * 2 });
                    });
                }
                
                levelPowerUps.push({
                    x: 1500 + (level * 3000),
                    y: 200,
                    width: 25,
                    height: 25,
                    type: 'extraLife',
                    collected: false,
                    bobOffset: 0
                });
                
                levels.push({
                    platforms: levelPlatforms,
                    obstacles: levelObstacles,
                    monsters: levelMonsters,
                    collectibles: levelCollectibles,
                    powerUps: levelPowerUps,
                    finishLine: { x: 2900 * worldWidthMultiplier, y: 300, width: 50, height: 100 },
                    worldWidth: 3000 * worldWidthMultiplier
                });
            }
        }
        
        generateLevels();
        let currentLevelData = levels[0];
        
        // Input handling
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === 'z' || e.key === 'Z') {
                if (!player.isAttacking && player.hasSwordPower) {
                    player.isAttacking = true;

                    player.attackTimer = 0;
                }
            }
            e.preventDefault();
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // ========== PARTICLE SYSTEM ==========
        class Particle {
            constructor(x, y, vx, vy, color, size, life, type = 'normal') {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.size = size;
                this.life = life;
                this.maxLife = life;
                this.type = type;
                this.rotation = Math.random() * Math.PI * 2;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2;
                this.life--;
                this.rotation += 0.1;
                return this.life > 0;
            }
            
            draw(ctx, cameraX, cameraY) {
                const alpha = this.life / this.maxLife;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(this.x - cameraX, this.y - cameraY);
                ctx.rotate(this.rotation);
                
                if (this.type === 'spark') {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.moveTo(0, -this.size);
                    ctx.lineTo(this.size * 0.3, 0);
                    ctx.lineTo(0, this.size);
                    ctx.lineTo(-this.size * 0.3, 0);
                    ctx.closePath();
                    ctx.fill();
                } else if (this.type === 'dust') {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * alpha, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                }
                
                ctx.restore();
            }
        }
        
        function createParticles(x, y, count, color, type = 'normal', spread = 3) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * spread + 1;
                particles.push(new Particle(
                    x, y,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed - 2,
                    color,
                    Math.random() * 4 + 2,
                    Math.random() * 30 + 20,
                    type
                ));
            }
        }
        
        function createDust(x, y, direction) {
            for (let i = 0; i < 3; i++) {
                particles.push(new Particle(
                    x, y,
                    direction * (Math.random() * 2 + 1),
                    -Math.random() * 1,
                    'rgba(139, 90, 43, 0.6)',
                    Math.random() * 3 + 2,
                    Math.random() * 15 + 10,
                    'dust'
                ));
            }
        }
        
        function createAttackSparks(x, y, facing) {
            for (let i = 0; i < 8; i++) {
                const angle = (facing === 'right' ? -0.5 : 2.5) + Math.random() * 1.5 - 0.75;
                const speed = Math.random() * 6 + 3;
                particles.push(new Particle(
                    x, y,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    ['#FFD700', '#FFA500', '#FFFFFF'][Math.floor(Math.random() * 3)],
                    Math.random() * 5 + 3,
                    Math.random() * 15 + 10,
                    'spark'
                ));
            }
        }
        
        // ========== SPRITE-BASED PLAYER DRAWING ==========
        function drawPlayer() {
            const screenX = player.x - camera.x;
            const screenY = player.y - camera.y;
            
            ctx.save();
            
            // Hurt flash effect
            if (player.isHurt && Math.floor(player.hurtTimer / 3) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }
            
            // Invincibility glow
            if (player.isInvincible) {
                ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
                ctx.beginPath();
                ctx.arc(screenX + player.width/2, screenY + player.height/2, player.width * 1.2, 0, Math.PI * 2);
                ctx.fill();
                
                if (Math.random() > 0.7) {
                    const sparkleAngle = Math.random() * Math.PI * 2;
                    const sparkleDist = player.width * 1.2;
                    createParticles(
                        screenX + player.width/2 + Math.cos(sparkleAngle) * sparkleDist,
                        screenY + player.height/2 + Math.sin(sparkleAngle) * sparkleDist,
                        1, '#FFFF00', 'spark'
                    );
                }
            }
            
            // Flying effect
            if (player.canFly) {
                ctx.fillStyle = 'rgba(0, 191, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(screenX + player.width/2, screenY + player.height/2, player.width * 1.2, 0, Math.PI * 2);
                ctx.fill();
                
                if (Math.random() > 0.5) {
                    createParticles(
                        screenX + player.width/2 + (Math.random() - 0.5) * 30,
                        screenY + player.height/2 + 20,
                        1, '#00BFFF', 'spark'
                    );
                }
            }
            
            // Draw shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.beginPath();
            ctx.ellipse(screenX + player.width/2, screenY + player.height + 5, 18, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Determine which animation to use
            let animName = 'idle';
            if (player.state === 'running') {
                const speed = Math.abs(player.velocityX);
                if (speed > 4) {
                    animName = 'sprint';
                } else if (speed > 3) {
                    animName = 'run_fast';
                } else {
                    animName = 'run';
                }
            } else {
                animName = 'idle';
            }
            
            // Update animation frame based on the animation speed
            const anim = SPRITE_ANIMS[animName];
            const frameIndex = Math.floor(player.animFrame / anim.speed) % anim.count;
            
            // Get source rectangle from spritesheet
            const srcX = frameIndex * SPRITE_FW;
            const srcY = anim.row * SPRITE_FH;
            
            // Calculate squash/stretch
            const drawW = CHAR_DISPLAY_W * player.squash;
            const drawH = CHAR_DISPLAY_H * player.stretch;
            const offsetX = (CHAR_DISPLAY_W - drawW) / 2;
            const offsetY = (CHAR_DISPLAY_H - drawH);
            
            // Flip based on direction
            if (player.facing === 'left') {
                ctx.translate(screenX + player.width, screenY);
                ctx.scale(-1, 1);
                ctx.translate(0, 0);
            } else {
                ctx.translate(screenX, screenY);
            }
            
            // Draw the sprite frame from spritesheet
            if (spriteLoaded) {
                ctx.drawImage(
                    spriteSheet,
                    srcX, srcY, SPRITE_FW, SPRITE_FH,  // source rectangle
                    offsetX, offsetY, drawW, drawH  // destination rectangle
                );
            } else {
                // Fallback: draw a simple rectangle if sprite not loaded
                ctx.fillStyle = '#4169E1';
                ctx.fillRect(0, 0, player.width, player.height);
            }
            
            // Draw sword overlay if player has sword power
            if (player.hasSwordPower) {
                const isAttacking = player.isAttacking;
                const attackArm = isAttacking ? player.swordSwingAngle : 0;
                
                ctx.save();
                ctx.translate(player.width * 0.7, player.height * 0.45);
                ctx.rotate(-Math.PI / 4 + (isAttacking ? player.swordSwingAngle * Math.PI / 180 : 0));
                
                // Sword blade
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.moveTo(-2, 0);
                ctx.lineTo(2, 0);
                ctx.lineTo(3, -30);
                ctx.lineTo(0, -35);
                ctx.lineTo(-3, -30);
                ctx.closePath();
                ctx.fill();
                
                // Sword glow during attack
                if (isAttacking) {
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.5)';
                    ctx.beginPath();
                    ctx.moveTo(-4, 0);
                    ctx.lineTo(4, 0);
                    ctx.lineTo(5, -32);
                    ctx.lineTo(0, -38);
                    ctx.lineTo(-5, -32);
                    ctx.closePath();
                    ctx.fill();
                }
                
                // Sword handle
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(-3, 2, 6, 8);
                
                // Guard
                ctx.fillStyle = '#FFD700';
                ctx.fillRect(-6, 0, 12, 3);
                
                ctx.restore();
            }
            
            ctx.restore();
        }
        
        // ========== MONSTER DRAWING ==========
        function drawMonsters() {
            currentLevelData.monsters.forEach(monster => {
                const screenX = monster.x - camera.x;
                const screenY = monster.y - camera.y;
                
                if (screenX < -50 || screenX > canvas.width + 50) return;
                
                ctx.save();
                
                if (monster.isHurt && Math.floor(monster.hurtTimer / 2) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }
                
                const squash = 1 + Math.sin(monster.animFrame * 0.2) * 0.1;
                const stretch = 1 - Math.sin(monster.animFrame * 0.2) * 0.1;
                
                ctx.translate(screenX + monster.width/2, screenY + monster.height/2);
                ctx.scale(squash, stretch);
                
                if (monster.type === 'slime') {
                    const bounce = Math.abs(Math.sin(monster.animFrame * 0.15)) * 5;
                    
                    const gradient = ctx.createRadialGradient(0, -bounce, 0, 0, -bounce, monster.width/2);
                    gradient.addColorStop(0, monster.isHurt ? '#FF6666' : '#AA66FF');
                    gradient.addColorStop(1, monster.color);
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.ellipse(0, -bounce, monster.width/2, monster.height/2 - bounce/2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.beginPath();
                    ctx.ellipse(-5, -bounce - 8, 5, 3, -0.3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.ellipse(-8, -bounce - 3, 6, 7, 0, 0, Math.PI * 2);
                    ctx.ellipse(8, -bounce - 3, 6, 7, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    const lookX = Math.sign(player.x - monster.x) * 2;
                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.arc(-8 + lookX, -bounce - 2, 3, 0, Math.PI * 2);
                    ctx.arc(8 + lookX, -bounce - 2, 3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 2;
                    const browAnger = monster.direction === -1 ? -0.3 : 0.3;
                    ctx.beginPath();
                    ctx.moveTo(-12, -bounce - 10);
                    ctx.lineTo(-4, -bounce - 10 + browAnger * 3);
                    ctx.moveTo(4, -bounce - 10 + browAnger * 3);
                    ctx.lineTo(12, -bounce - 10);
                    ctx.stroke();
                    
                    ctx.fillStyle = '#660066';
                    ctx.beginPath();
                    ctx.arc(0, -bounce + 8, 5, 0, Math.PI);
                    ctx.fill();
                    
                } else if (monster.type === 'bat') {
                    const wingFlap = Math.sin(monster.animFrame * 0.3) * 0.5;
                    const hover = Math.sin(monster.animFrame * 0.1) * 3;
                    
                    ctx.fillStyle = monster.color;
                    ctx.beginPath();
                    ctx.ellipse(0, hover, 12, 15, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#AA2200';
                    ctx.save();
                    ctx.translate(-8, hover - 5);
                    ctx.rotate(-wingFlap - 0.3);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(-20, -10, -25, 5);
                    ctx.quadraticCurveTo(-15, 10, 0, 10);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                    
                    ctx.save();
                    ctx.translate(8, hover - 5);
                    ctx.rotate(wingFlap + 0.3);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(20, -10, 25, 5);
                    ctx.quadraticCurveTo(15, 10, 0, 10);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                    
                    ctx.fillStyle = monster.color;
                    ctx.beginPath();
                    ctx.moveTo(-5, hover - 12);
                    ctx.lineTo(-8, hover - 25);
                    ctx.lineTo(-2, hover - 15);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(5, hover - 12);
                    ctx.lineTo(8, hover - 25);
                    ctx.lineTo(2, hover - 15);
                    ctx.closePath();
                    ctx.fill();
                    
                    ctx.fillStyle = 'yellow';
                    ctx.beginPath();
                    ctx.arc(-4, hover - 2, 4, 0, Math.PI * 2);
                    ctx.arc(4, hover - 2, 4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.arc(-4, hover - 1, 2, 0, Math.PI * 2);
                    ctx.arc(4, hover - 1, 2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.moveTo(-3, hover + 8);
                    ctx.lineTo(-1, hover + 15);
                    ctx.lineTo(1, hover + 8);
                    ctx.closePath();
                    ctx.fill();
                }
                
                ctx.restore();
            });
        }
        
        // ========== PLATFORM DRAWING ==========
        function drawPlatforms() {
            currentLevelData.platforms.forEach(platform => {
                const screenX = platform.x - camera.x;
                const screenY = platform.y - camera.y;
                
                if (screenX < -platform.width || screenX > canvas.width + 50) return;
                
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(screenX, screenY + 8, platform.width, platform.height - 8);
                
                ctx.fillStyle = '#228B22';
                ctx.fillRect(screenX, screenY, platform.width, 10);
                
                ctx.fillStyle = '#32CD32';
                for (let i = 0; i < platform.width; i += 8) {
                    const grassHeight = 4 + Math.sin(gameTime * 0.05 + i * 0.1) * 2;
                    ctx.beginPath();
                    ctx.moveTo(screenX + i, screenY);
                    ctx.lineTo(screenX + i + 4, screenY - grassHeight);
                    ctx.lineTo(screenX + i + 8, screenY);
                    ctx.fill();
                }
                
                ctx.fillStyle = '#654321';
                ctx.fillRect(screenX, screenY + platform.height - 5, platform.width, 5);
                
                ctx.fillStyle = '#A0522D';
                for (let i = 0; i < platform.width; i += 20) {
                    ctx.fillRect(screenX + i + 5, screenY + 15, 10, 3);
                }
            });
        }
        
        // ========== OBSTACLE DRAWING ==========
        function drawObstacles() {
            currentLevelData.obstacles.forEach(obstacle => {
                const screenX = obstacle.x - camera.x;
                const screenY = obstacle.y - camera.y;
                
                if (screenX < -50 || screenX > canvas.width + 50) return;
                
                switch (obstacle.type) {
                    case 'spikes':
                        for (let i = 0; i < obstacle.width; i += 10) {
                            const spikePhase = gameTime * 0.1 + i * 0.2;
                            const spikeHeight = obstacle.height + Math.sin(spikePhase) * 2;
                            
                            ctx.fillStyle = '#808080';
                            ctx.beginPath();
                            ctx.moveTo(screenX + i, screenY + obstacle.height);
                            ctx.lineTo(screenX + i + 5, screenY);
                            ctx.lineTo(screenX + i + 10, screenY + obstacle.height);
                            ctx.closePath();
                            ctx.fill();
                            
                            ctx.fillStyle = '#A0A0A0';
                            ctx.beginPath();
                            ctx.moveTo(screenX + i + 2, screenY + obstacle.height - 5);
                            ctx.lineTo(screenX + i + 5, screenY + 3);
                            ctx.lineTo(screenX + i + 6, screenY + obstacle.height - 5);
                            ctx.closePath();
                            ctx.fill();
                        }
                        break;
                        
                    case 'falling':
                        ctx.fillStyle = '#CD853F';
                        ctx.fillRect(screenX, screenY, obstacle.width, obstacle.height);
                        
                        ctx.strokeStyle = '#8B4513';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(screenX + 10, screenY);
                        ctx.lineTo(screenX + 15, screenY + obstacle.height);
                        ctx.moveTo(screenX + 30, screenY);
                        ctx.lineTo(screenX + 25, screenY + obstacle.height);
                        ctx.moveTo(screenX + 50, screenY);
                        ctx.lineTo(screenX + 55, screenY + obstacle.height);
                        ctx.stroke();
                        
                        if (obstacle.falling) {
                            ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
                            ctx.fillRect(screenX, screenY, obstacle.width, obstacle.height);
                        }
                        break;
                        
                    case 'fire':
                        for (let i = 0; i < obstacle.width; i += 8) {
                            const flameHeight = obstacle.height + Math.sin(gameTime * 0.2 + i) * 8;
                            const flameColors = ['#FF4500', '#FF8C00', '#FFA500', '#FFD700'];
                            const colorIndex = Math.floor((gameTime * 0.1 + i * 0.1) % flameColors.length);
                            
                            ctx.fillStyle = flameColors[colorIndex];
                            ctx.beginPath();
                            ctx.moveTo(screenX + i, screenY + obstacle.height);
                            ctx.quadraticCurveTo(screenX + i + 4, screenY - flameHeight/2, screenX + i + 4, screenY - flameHeight);
                            ctx.quadraticCurveTo(screenX + i + 8, screenY - flameHeight/2, screenX + i + 8, screenY + obstacle.height);
                            ctx.closePath();
                            ctx.fill();
                        }
                        
                        ctx.fillStyle = 'rgba(255, 100, 0, 0.3)';
                        ctx.beginPath();
                        ctx.arc(screenX + obstacle.width/2, screenY, obstacle.width/2, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                        
                    case 'moving':
                        ctx.fillStyle = '#4682B4';
                        ctx.fillRect(screenX, screenY, obstacle.width, obstacle.height);
                        
                        ctx.fillStyle = '#1E90FF';
                        ctx.fillRect(screenX + 5, screenY + 5, obstacle.width - 10, obstacle.height - 10);
                        
                        ctx.fillStyle = '#FFFFFF';
                        ctx.beginPath();
                        if (obstacle.direction > 0) {
                            ctx.moveTo(screenX + 15, screenY + obstacle.height/2);
                            ctx.lineTo(screenX + 25, screenY + obstacle.height/2 - 4);
                            ctx.lineTo(screenX + 25, screenY + obstacle.height/2 + 4);
                        } else {
                            ctx.moveTo(screenX + obstacle.width - 15, screenY + obstacle.height/2);
                            ctx.lineTo(screenX + obstacle.width - 25, screenY + obstacle.height/2 - 4);
                            ctx.lineTo(screenX + obstacle.width - 25, screenY + obstacle.height/2 + 4);
                        }
                        ctx.closePath();
                        ctx.fill();
                        break;
                }
            });
        }
        
        // ========== COLLECTIBLE DRAWING ==========
        function drawCollectibles() {
            currentLevelData.collectibles.forEach(collectible => {
                if (!collectible.collected) {
                    const screenX = collectible.x - camera.x;
                    const bobY = Math.sin(gameTime * 0.1 + collectible.bobOffset) * 5;
                    const screenY = collectible.y - camera.y + bobY;
                    
                    if (screenX < -30 || screenX > canvas.width + 30) return;
                    
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
                    ctx.beginPath();
                    ctx.arc(screenX + collectible.width/2, screenY + collectible.height/2, collectible.width, 0, Math.PI * 2);
                    ctx.fill();
                    
                    const gradient = ctx.createLinearGradient(screenX, screenY, screenX + collectible.width, screenY + collectible.height);
                    gradient.addColorStop(0, '#FFD700');
                    gradient.addColorStop(0.5, '#FFF8DC');
                    gradient.addColorStop(1, '#FFD700');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.moveTo(screenX + collectible.width / 2, screenY);
                    ctx.lineTo(screenX + collectible.width, screenY + collectible.height / 3);
                    ctx.lineTo(screenX + collectible.width, screenY + collectible.height * 2 / 3);
                    ctx.lineTo(screenX + collectible.width / 2, screenY + collectible.height);
                    ctx.lineTo(screenX, screenY + collectible.height * 2 / 3);
                    ctx.lineTo(screenX, screenY + collectible.height / 3);
                    ctx.closePath();
                    ctx.fill();
                    
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.beginPath();
                    ctx.arc(screenX + collectible.width / 3, screenY + collectible.height / 3, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
        
        // ========== POWER-UP DRAWING ==========
        function drawPowerUps() {
            currentLevelData.powerUps.forEach(powerUp => {
                if (!powerUp.collected) {
                    const screenX = powerUp.x - camera.x;
                    const bobY = Math.sin(gameTime * 0.08 + powerUp.bobOffset) * 5;
                    const screenY = powerUp.y - camera.y + bobY;
                    
                    if (screenX < -30 || screenX > canvas.width + 30) return;
                    
                    const glowSize = powerUp.width/2 + Math.sin(gameTime * 0.1) * 3;
                    
                    switch (powerUp.type) {
                        case 'sword':
                            ctx.save();
                            ctx.translate(screenX + powerUp.width/2, screenY + powerUp.height/2);
                            ctx.rotate(gameTime * 0.05);
                            
                            ctx.fillStyle = 'rgba(255, 215, 0, 0.5)';
                            ctx.beginPath();
                            ctx.arc(0, 0, glowSize + 5, 0, Math.PI * 2);
                            ctx.fill();
                            
                            ctx.fillStyle = '#FFD700';
                            ctx.fillRect(-powerUp.width/2, -powerUp.height/2, powerUp.width, powerUp.height);
                            
                            ctx.fillStyle = '#8B4513';
                            ctx.fillRect(-2, -8, 4, 12);
                            ctx.fillStyle = '#C0C0C0';
                            ctx.fillRect(-1, -12, 2, 16);
                            ctx.fillRect(-4, -2, 8, 3);
                            
                            ctx.restore();
                            break;
                            
                        case 'invincible':
                            ctx.fillStyle = 'rgba(255, 255, 0, 0.5)';
                            ctx.beginPath();
                            ctx.arc(screenX + powerUp.width/2, screenY + powerUp.height/2, glowSize + 5, 0, Math.PI * 2);
                            ctx.fill();
                            
                            ctx.fillStyle = '#FFFF00';
                            ctx.beginPath();
                            const starX = screenX + powerUp.width/2;
                            const starY = screenY + powerUp.height/2;
                            for (let i = 0; i < 5; i++) {
                                const angle = (i * 72 - 90 + gameTime * 2) * Math.PI / 180;
                                const innerAngle = ((i * 72) + 36 - 90 + gameTime * 2) * Math.PI / 180;
                                if (i === 0) {
                                    ctx.moveTo(starX + Math.cos(angle) * 12, starY + Math.sin(angle) * 12);
                                } else {
                                    ctx.lineTo(starX + Math.cos(angle) * 12, starY + Math.sin(angle) * 12);
                                }
                                ctx.lineTo(starX + Math.cos(innerAngle) * 6, starY + Math.sin(innerAngle) * 6);
                            }
                            ctx.closePath();
                            ctx.fill();
                            break;
                            
                        case 'fly':
                            ctx.fillStyle = 'rgba(0, 191, 255, 0.5)';
                            ctx.beginPath();
                            ctx.arc(screenX + powerUp.width/2, screenY + powerUp.height/2, glowSize + 5, 0, Math.PI * 2);
                            ctx.fill();
                            
                            ctx.fillStyle = '#00BFFF';
                            ctx.beginPath();
                            ctx.moveTo(screenX + powerUp.width/2, screenY + powerUp.height/2);
                            ctx.quadraticCurveTo(screenX - 5, screenY - 5, screenX - 3, screenY + powerUp.height + 5);
                            ctx.quadraticCurveTo(screenX + powerUp.width/4, screenY + powerUp.height/2, screenX + powerUp.width/2, screenY + powerUp.height/2);
                            ctx.fill();
                            ctx.beginPath();
                            ctx.moveTo(screenX + powerUp.width/2, screenY + powerUp.height/2);
                            ctx.quadraticCurveTo(screenX + powerUp.width + 5, screenY - 5, screenX + powerUp.width + 3, screenY + powerUp.height + 5);
                            ctx.quadraticCurveTo(screenX + powerUp.width * 3/4, screenY + powerUp.height/2, screenX + powerUp.width/2, screenY + powerUp.height/2);
                            ctx.fill();
                            break;
                            
                        case 'extraLife':
                            ctx.fillStyle = 'rgba(255, 105, 180, 0.5)';
                            ctx.beginPath();
                            ctx.arc(screenX + powerUp.width/2, screenY + powerUp.height/2, glowSize + 5, 0, Math.PI * 2);
                            ctx.fill();
                            
                            ctx.fillStyle = '#FF69B4';
                            ctx.beginPath();
                            const heartX = screenX + powerUp.width/2;
                            const heartY = screenY + powerUp.height/2 + 2;
                            ctx.moveTo(heartX, heartY + 5);
                            ctx.bezierCurveTo(heartX - 10, heartY - 5, heartX - 10, heartY - 12, heartX, heartY - 5);
                            ctx.bezierCurveTo(heartX + 10, heartY - 12, heartX + 10, heartY - 5, heartX, heartY + 5);
                            ctx.fill();
                            
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                            ctx.beginPath();
                            ctx.arc(heartX - 4, heartY - 6, 3, 0, Math.PI * 2);
                            ctx.fill();
                            break;
                    }
                }
            });
        }
        
        // ========== FINISH LINE DRAWING ==========
        function drawFinishLine() {
            const screenX = currentLevelData.finishLine.x - camera.x;
            const screenY = currentLevelData.finishLine.y - camera.y;
            
            if (screenX < -100 || screenX > canvas.width + 100) return;
            
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(screenX + currentLevelData.finishLine.width / 2 - 3, screenY, 6, currentLevelData.finishLine.height);
            
            ctx.fillStyle = '#FF0000';
            ctx.beginPath();
            const flagWave = Math.sin(gameTime * 0.1) * 5;
            ctx.moveTo(screenX + currentLevelData.finishLine.width / 2 + 3, screenY);
            ctx.quadraticCurveTo(screenX + currentLevelData.finishLine.width - 10 + flagWave, screenY + 15, screenX + currentLevelData.finishLine.width, screenY + 15);
            ctx.quadraticCurveTo(screenX + currentLevelData.finishLine.width - 10 + flagWave, screenY + 30, screenX + currentLevelData.finishLine.width / 2 + 3, screenY + 30);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            const starCenterX = screenX + currentLevelData.finishLine.width - 15;
            const starCenterY = screenY + 15;
            for (let i = 0; i < 5; i++) {
                const angle = (i * 72 - 90) * Math.PI / 180;
                const innerAngle = ((i * 72) + 36 - 90) * Math.PI / 180;
                if (i === 0) {
                    ctx.moveTo(starCenterX + Math.cos(angle) * 8, starCenterY + Math.sin(angle) * 8);
                } else {
                    ctx.lineTo(starCenterX + Math.cos(angle) * 8, starCenterY + Math.sin(angle) * 8);
                }
                ctx.lineTo(starCenterX + Math.cos(innerAngle) * 4, starCenterY + Math.sin(innerAngle) * 4);
            }
            ctx.closePath();
            ctx.fill();
        }
        
        // ========== BACKGROUND DRAWING ==========
        function drawBackground() {
            const cloudOffset = (camera.x * 0.2) % 1500;
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for (let i = 0; i < 5; i++) {
                const baseX = (i * 300 - cloudOffset + 1500) % 1500 - 300;
                const baseY = 60 + i * 30;
                
                ctx.beginPath();
                ctx.arc(baseX, baseY, 25, 0, Math.PI * 2);
                ctx.arc(baseX + 30, baseY - 5, 30, 0, Math.PI * 2);
                ctx.arc(baseX + 60, baseY, 25, 0, Math.PI * 2);
                ctx.arc(baseX + 30, baseY + 10, 20, 0, Math.PI * 2);
                ctx.fill();
            }
            
            const mountainOffset = (camera.x * 0.1) % 900;
            ctx.fillStyle = '#8B7355';
            ctx.beginPath();
            ctx.moveTo(-50, 350);
            for (let i = 0; i < 10; i++) {
                const x = i * 150 - mountainOffset;
                const height = 100 + Math.sin(i * 1.5) * 80;
                ctx.lineTo(x + 75, 350 - height);
                ctx.lineTo(x + 150, 350);
            }
            ctx.lineTo(950, 500);
            ctx.lineTo(-50, 500);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for (let i = 0; i < 10; i++) {
                const x = i * 150 - mountainOffset;
                const height = 100 + Math.sin(i * 1.5) * 80;
                ctx.beginPath();
                ctx.moveTo(x + 75, 350 - height);
                ctx.lineTo(x + 65, 350 - height + 20);
                ctx.lineTo(x + 85, 350 - height + 20);
                ctx.closePath();
                ctx.fill();
            }
        }
        
        // ========== PLAYER UPDATE ==========
        function updatePlayer() {
            const wasOnGround = player.onGround;
            
            if (player.isHurt) {
                player.hurtTimer--;
                if (player.hurtTimer <= 0) {
                    player.isHurt = false;
                }
            }
            
            // Attack animation
            if (player.isAttacking) {
                player.attackTimer++;
                player.swordSwingAngle = Math.sin(player.attackTimer * 0.3) * 120;
                
                if (player.attackTimer > 20) {
                    player.isAttacking = false;
                    player.swordSwingAngle = 0;
                }
                
                if (player.attackTimer === 5) {
                    const attackX = player.facing === 'right' ? player.x + player.width + 10 : player.x - 10;
                    createAttackSparks(attackX, player.y + 30, player.facing);
                    createAttackSparks(attackX, player.y + 35, player.facing);
                }
            }
            
            // Handle input
            if (keys['ArrowLeft']) {
                player.velocityX = -player.speed;
                player.facing = 'left';
            } else if (keys['ArrowRight']) {
                player.velocityX = player.speed;
                player.facing = 'right';
            } else {
                player.velocityX *= 0.8;
            }
            
            // Flying controls
            if (player.canFly) {
                if (keys['ArrowUp']) {
                    player.velocityY = -player.speed;
                } else if (keys['ArrowDown']) {
                    player.velocityY = player.speed;
                } else {
                    player.velocityY *= 0.8;
                }
            } else {
                if (keys[' '] && player.onGround) {
                    player.velocityY = -player.jumpPower;
                    player.onGround = false;
                    player.stretch = 1.3;
                    player.squash = 0.7;
                    createDust(player.x + player.width/2, player.y + player.height, 0);
                }
                
                if (!player.onGround) {
                    player.velocityY += 0.8;
                }
            }
            
            // Update position
            player.x += player.velocityX;
            player.y += player.velocityY;
            
            // Create running dust
            if (player.onGround && Math.abs(player.velocityX) > 2 && player.state === 'running') {
                if (Math.random() > 0.7) {
                    createDust(player.x + player.width/2, player.y + player.height, -Math.sign(player.velocityX));
                }
            }
            
            // Landing squash effect
            if (player.onGround && !wasOnGround) {
                player.squash = 1.3;
                player.stretch = 0.7;
                player.justLanded = true;
                player.landTimer = 10;
                createDust(player.x + player.width/2, player.y + player.height, 1);
                createDust(player.x + player.width/2, player.y + player.height, -1);
            }
            
            // Animate squash/stretch back to normal
            player.squash += (1 - player.squash) * 0.2;
            player.stretch += (1 - player.stretch) * 0.2;
            
            // Update animation state
            if (!player.onGround) {
                player.state = player.velocityY < 0 ? 'jumping' : 'falling';
            } else if (Math.abs(player.velocityX) > 0.5) {
                player.state = 'running';
            } else {
                player.state = 'idle';
            }
            
            // Update animation frame counter
            player.animTimer++;
            if (player.animTimer >= 2) {
                player.animTimer = 0;
                player.animFrame++;
            }
            
            // Check if player fell off
            if (player.y > 600) {
                lives--;
                resetPlayer();
                updateUI();
                screenShake = { intensity: 10, duration: 20 };
                
                if (lives <= 0) {
                    gameOver();
                }
            }
            
            // World bounds
            if (player.x < 0) player.x = 0;
            if (player.x > currentLevelData.worldWidth - player.width) {
                player.x = currentLevelData.worldWidth - player.width;
            }
            
            // Update power-up timers
            if (player.isInvincible) {
                player.invincibleTimer--;
                if (player.invincibleTimer <= 0) {
                    player.isInvincible = false;
                }
            }
            
            if (player.canFly) {
                player.flyTimer--;
                if (player.flyTimer <= 0) {
                    player.canFly = false;
                }
            }
            
            updatePowerIndicator();
        }
        
        // ========== OBSTACLE UPDATE ==========
        function updateObstacles() {
            currentLevelData.obstacles.forEach(obstacle => {
                switch (obstacle.type) {
                    case 'falling':
                        if (!obstacle.falling &&
                            player.x < obstacle.x + obstacle.width &&
                            player.x + player.width > obstacle.x &&
                            player.y + player.height > obstacle.y &&
                            player.y + player.height < obstacle.y + obstacle.height + 10) {
                            obstacle.falling = true;
                        }
                        
                        if (obstacle.falling) {
                            obstacle.fallSpeed += 0.5;
                            obstacle.y += obstacle.fallSpeed;
                            
                            if (obstacle.y > 600) {
                                obstacle.y = 280;
                                obstacle.falling = false;
                                obstacle.fallSpeed = 0;
                            }
                        }
                        break;
                        
                    case 'moving':
                        obstacle.x += obstacle.direction * 2;
                        
                        if (obstacle.x <= obstacle.minX || obstacle.x + obstacle.width >= obstacle.maxX) {
                            obstacle.direction *= -1;
                        }
                        break;
                }
            });
        }
        
        // ========== MONSTER UPDATE ==========
        function updateMonsters() {
            currentLevelData.monsters.forEach(monster => {
                monster.animFrame++;
                
                if (monster.isHurt) {
                    monster.hurtTimer--;
                    if (monster.hurtTimer <= 0) {
                        monster.isHurt = false;
                    }
                }
                
                monster.x += monster.direction * monster.speed;
                
                if (monster.type === 'bat') {
                    monster.y = monster.originalY + Math.sin(monster.animFrame * 0.1) * 10;
                }
                
                if (monster.x <= monster.minX || monster.x + monster.width >= monster.maxX) {
                    monster.direction *= -1;
                }
            });
        }
        
        // ========== COLLISION DETECTION ==========
        function checkCollisions() {
            player.onGround = false;
            currentLevelData.platforms.forEach(platform => {
                if (player.x < platform.x + platform.width &&
                    player.x + player.width > platform.x &&
                    player.y < platform.y + platform.height &&
                    player.y + player.height > platform.y) {
                    
                    if (player.velocityY > 0 && player.y < platform.y) {
                        player.y = platform.y - player.height;
                        player.velocityY = 0;
                        player.onGround = true;
                    }
                }
            });
            
            if (!player.isInvincible && !player.isHurt) {
                currentLevelData.obstacles.forEach(obstacle => {
                    if (player.x < obstacle.x + obstacle.width &&
                        player.x + player.width > obstacle.x &&
                        player.y < obstacle.y + obstacle.height &&
                        player.y + player.height > obstacle.y) {
                        
                        lives--;
                        player.isHurt = true;
                        player.hurtTimer = 60;
                        screenShake = { intensity: 8, duration: 15 };
                        resetPlayer();
                        updateUI();
                        
                        if (lives <= 0) {
                            gameOver();
                        }
                    }
                });
            }
            
            currentLevelData.monsters.forEach((monster, index) => {
                if (player.isAttacking) {
                    const attackRange = 50;
                    const attackX = player.facing === 'right' ? player.x + player.width : player.x - attackRange;
                    
                    if (attackX < monster.x + monster.width &&
                        attackX + attackRange > monster.x &&
                        player.y < monster.y + monster.height &&
                        player.y + player.height > monster.y) {
                        
                        currentLevelData.monsters.splice(index, 1);
                        score += 50;
                        updateUI();
                        screenShake = { intensity: 5, duration: 10 };
                        
                        createParticles(
                            monster.x + monster.width/2,
                            monster.y + monster.height/2,
                            15,
                            monster.color,
                            'spark',
                            4
                        );
                        return;
                    }
                }
                
                if (player.x < monster.x + monster.width &&
                    player.x + player.width > monster.x &&
                    player.y < monster.y + monster.height &&
                    player.y + player.height > monster.y) {
                    
                    if (player.hasSwordPower || player.isInvincible) {
                        currentLevelData.monsters.splice(index, 1);
                        score += 50;
                        updateUI();
                        
                        createParticles(
                            monster.x + monster.width/2,
                            monster.y + monster.height/2,
                            15,
                            monster.color,
                            'spark'
                        );
                    } else if (!player.isInvincible && !player.isHurt) {
                        lives--;
                        player.isHurt = true;
                        player.hurtTimer = 60;
                        screenShake = { intensity: 8, duration: 15 };
                        resetPlayer();
                        updateUI();
                        
                        if (lives <= 0) {
                            gameOver();
                        }
                    }
                }
            });
            
            currentLevelData.collectibles.forEach(collectible => {
                if (!collectible.collected &&
                    player.x < collectible.x + collectible.width &&
                    player.x + player.width > collectible.x &&
                    player.y < collectible.y + collectible.height &&
                    player.y + player.height > collectible.y) {
                    
                    collectible.collected = true;
                    score += 100;
                    updateUI();
                    
                    createParticles(
                        collectible.x + collectible.width/2,
                        collectible.y + collectible.height/2,
                        10,
                        '#FFD700',
                        'spark'
                    );
                }
            });
            
            currentLevelData.powerUps.forEach(powerUp => {
                if (!powerUp.collected &&
                    player.x < powerUp.x + powerUp.width &&
                    player.x + player.width > powerUp.x &&
                    player.y < powerUp.y + powerUp.height &&
                    player.y + player.height > powerUp.y) {
                    
                    powerUp.collected = true;
                    
                    switch (powerUp.type) {
                        case 'sword':
                            player.hasSwordPower = true;
                            break;
                        case 'invincible':
                            player.isInvincible = true;
                            player.invincibleTimer = 600;
                            break;
                        case 'fly':
                            player.canFly = true;
                            player.flyTimer = 480;
                            break;
                        case 'extraLife':
                            lives++;
                            updateUI();
                            break;
                    }
                    
                    createParticles(
                        powerUp.x + powerUp.width/2,
                        powerUp.y + powerUp.height/2,
                        12,
                        '#FF69B4',
                        'spark'
                    );
                }
            });
            
            if (player.x < currentLevelData.finishLine.x + currentLevelData.finishLine.width &&
                player.x + player.width > currentLevelData.finishLine.x &&
                player.y < currentLevelData.finishLine.y + currentLevelData.finishLine.height &&
                player.y + player.height > currentLevelData.finishLine.y) {
                
                if (currentLevel < 8) {
                    levelComplete();
                } else {
                    gameWin();
                }
            }
        }
        
        // ========== CAMERA ==========
        function updateCamera() {
            camera.x = player.x - canvas.width / 2;
            
            if (camera.x < 0) camera.x = 0;
            if (camera.x > currentLevelData.worldWidth - canvas.width) {
                camera.x = currentLevelData.worldWidth - canvas.width;
            }
        }
        
        // ========== RESET PLAYER ==========
        function resetPlayer() {
            player.x = 100;
            player.y = 300;
            player.velocityX = 0;
            player.velocityY = 0;
            player.hasSwordPower = false;
            player.isInvincible = false;
            player.canFly = false;
            player.invincibleTimer = 0;
            player.flyTimer = 0;
            player.isAttacking = false;
            player.isHurt = false;
            player.squash = 1;
            player.stretch = 1;
            player.animFrame = 0;
        }
        
        // ========== UI ==========
        function updateUI() {
            document.getElementById('level').textContent = currentLevel;
            document.getElementById('lives').textContent = lives;
            document.getElementById('score').textContent = score;
        }
        
        function updatePowerIndicator() {
            const indicator = document.getElementById('powerIndicator');
            let text = '';
            
            if (player.hasSwordPower) text += 'Sword Power ';
            if (player.isInvincible) text += 'Invincible: ' + Math.ceil(player.invincibleTimer / 60) + 's ';
            if (player.canFly) text += 'Flying: ' + Math.ceil(player.flyTimer / 60) + 's ';
            
            indicator.textContent = text;
        }
        
        // ========== GAME STATE ==========
        function gameOver() {
            gameRunning = false;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        function gameWin() {
            gameRunning = false;
            document.getElementById('gameWin').style.display = 'block';
        }
        
        function levelComplete() {
            gameRunning = false;
            document.getElementById('levelComplete').style.display = 'block';
        }
        
        function nextLevel() {
            currentLevel++;
            currentLevelData = levels[currentLevel - 1];
            worldWidth = currentLevelData.worldWidth;
            
            resetPlayer();
            updateUI();
            
            document.getElementById('levelComplete').style.display = 'none';
            gameRunning = true;
        }
        
        function restartGame() {
            currentLevel = 1;
            currentLevelData = levels[0];
            worldWidth = currentLevelData.worldWidth;
            score = 0;
            lives = 3;
            particles.length = 0;
            
            generateLevels();
            currentLevelData = levels[0];
            
            resetPlayer();
            updateUI();
            
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('gameWin').style.display = 'none';
            gameRunning = true;
        }
        
        // ========== GAME LOOP ==========
        function gameLoop() {
            gameTime++;
            
            ctx.save();
            if (screenShake.duration > 0) {
                const shakeX = (Math.random() - 0.5) * screenShake.intensity;
                const shakeY = (Math.random() - 0.5) * screenShake.intensity;
                ctx.translate(shakeX, shakeY);
                screenShake.duration--;
            }
            
            ctx.clearRect(-20, -20, canvas.width + 40, canvas.height + 40);
            
            drawBackground();
            
            if (gameRunning) {
                updatePlayer();
                updateObstacles();
                updateMonsters();
                checkCollisions();
                updateCamera();
            }
            
            for (let i = particles.length - 1; i >= 0; i--) {
                if (!particles[i].update()) {
                    particles.splice(i, 1);
                }
            }
            
            drawPlatforms();
            drawObstacles();
            drawMonsters();
            drawCollectibles();
            drawPowerUps();
            drawFinishLine();
            drawPlayer();
            
            particles.forEach(p => p.draw(ctx, camera.x, camera.y));
            
            ctx.restore();
            
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.getElementById('restartBtn').addEventListener('click', restartGame);
        document.getElementById('playAgainBtn').addEventListener('click', restartGame);
        document.getElementById('nextLevelBtn').addEventListener('click', nextLevel);
        
        // Initialize game
        updateUI();
        gameLoop();
    </script>

    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js')
                    .then(function(registration) {
                        console.log('Service Worker registered with scope:', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }

        // Handle PWA install prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            console.log('PWA install prompt ready');
        });
    </script>
